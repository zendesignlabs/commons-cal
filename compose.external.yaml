# Alternative to compose.yaml: use an existing dedicated Radicale account.
services:
  commons:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4010
      CALENDAR_DATA_DIR: /data
    ports:
      - "127.0.0.1:${PORT:-4010}:4010"
    volumes:
      - commons_metadata:/data
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  commons_metadata:
